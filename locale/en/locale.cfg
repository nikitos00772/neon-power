[mod-setting-description]
neon-power-color=Default colour when no circuit network is connected
neon-power-core-width=Bright centre line, shown while the cable is lit.
neon-power-tube-width=The tube around the core: cable colour while lit, grey while unlit. Keep wider than the core.
neon-power-glow-width=Soft shine around the tube that fades out towards its edge, shown while lit.
neon-power-glow-layers=How smoothly the shine fades out. Higher values look smoother but can lower performance on large bases.
neon-power-cable-glow=Light the cables cast at night.
neon-power-pole-glow=Light each powered neon pole casts at night.
